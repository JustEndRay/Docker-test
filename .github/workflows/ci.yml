name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          hostname
          uname -a
          pwd

      - name: Check
        run: |
          test -f Backend/app.py

      - name: Lint Python code
        uses: astral-sh/ruff-action@v3
        with:
          args: "check Backend/app.py"
#test
